<sly data-sly-use.widgetModel="com.adobe.learning.core.models.ALMWidgetModel">
  <sly data-sly-test="${widgetModel.hasWidgetConfig}">
    <div class="alm-widget-container" 
         data-sly-attribute.data-widget-props="${widgetModel.widgetConfigs}"
         style="margin: calc(var(--prime-layout-gutter-space, 10px) * 2) calc(var(--prime-layout-gutter-space) / 2);">
    </div>
  </sly>
  <sly data-sly-test="${!widgetModel.hasWidgetConfig}">
    <div class="alm-widget-placeholder" style="padding: 20px; border: 2px dashed #ccc; text-align: center; background-color: #f9f9f9;">
      <p style="margin: 0; color: #666; font-style: italic;">
        Please configure the widget type in the component dialog to render the Adobe Learning Manager widget.
      </p>
    </div>
  </sly>
</sly>
